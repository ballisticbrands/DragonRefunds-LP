<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logos/dragonbot_fire.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Refunds — Get Back What Amazon Owes You</title>
    <!-- Structured data (JSON-LD). Lives in the shell so every prerendered
         route inherits it — postbuild-spa-routes.mjs rewrites <title> and the
         meta block only, and prerender.mjs touches #root only.

         ⚠️ Keep the `description` below in sync with public/llms.txt and the
         per-route meta descriptions in scripts/postbuild-spa-routes.mjs: models
         cross-check the three, and a contradiction costs trust.
         ⚠️ NEVER add aggregateRating or review here. We have no published
         reviews; fabricated rating markup is a structured-data violation and
         can earn a manual action. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://dragonrefunds.com/#organization",
          "name": "Chacha Advisory LLC",
          "alternateName": "Dragon Refunds",
          "url": "https://dragonrefunds.com",
          "logo": "https://dragonrefunds.com/DragonBot-logo.png",
          "email": "info@dragonrefunds.com",
          "address": {
            "@type": "PostalAddress",
            "streetAddress": "30 N Gould St Ste R",
            "addressLocality": "Sheridan",
            "addressRegion": "WY",
            "postalCode": "82801",
            "addressCountry": "US"
          }
        },
        {
          "@type": "SoftwareApplication",
          "@id": "https://dragonrefunds.com/#software",
          "name": "Dragon Refunds",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://dragonrefunds.com",
          "description": "Dragon Refunds finds the FBA reimbursements Amazon owes a seller — lost and damaged inventory, short-received shipments, fee and dimension overcharges, refunds where the item was never returned, and sourcing-cost errors — and shows the exact action to recover each one. Finding them is free forever: file the claims yourself and keep 100%, or hand a claim off and pay 15% of what is actually recovered.",
          "featureList": [
            "Free audit of your full Amazon reimbursement history, itemized by cause",
            "Claims ranked by filing deadline, not dollar value",
            "Lost, damaged, short-received, fee overcharge and customer-return claims across FBA and AWD",
            "File it yourself and keep 100%, or hand it off for 15% of what is recovered"
          ],
          "publisher": { "@id": "https://dragonrefunds.com/#organization" },
          "offers": [
            {
              "@type": "Offer",
              "name": "DIY",
              "price": "0",
              "priceCurrency": "USD",
              "description": "Free forever. The full reimbursement audit plus the steps to file each claim yourself through Seller Central. You keep 100% of what you recover. No credit card required."
            },
            {
              "@type": "Offer",
              "name": "Hands-free",
              "priceCurrency": "USD",
              "description": "No subscription and nothing up front. Dragon Refunds files the claim and follows it to close for 15% of what is actually recovered, charged only if the claim is won."
            }
          ]
        }
      ]
    }
    </script>
    <!-- Fonts: preconnect + <link> in <head> (discovered early, non-blocking)
         instead of a chained CSS @import. display=swap avoids invisible text. -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <!-- Load fonts non-render-blocking: fetch as a preload, then flip to a
         stylesheet on load so it never blocks first paint. display=swap keeps
         text visible in the fallback font meanwhile. -->
    <link rel="preload" as="style"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet"
        href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700&display=swap" />
    </noscript>
    <!-- Microsoft Clarity -->
    <script type="text/javascript">
      (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
      })(window, document, "clarity", "script", "xpykdkfhjg");
    </script>
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-H3DKKWESYR"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-H3DKKWESYR');
    </script>
    <!-- Meta Pixel. Own dataset for dragonrefunds.com — deliberately NOT
         DragonBot's pixel, which this LP inherited and dropped in 535effd:
         both brands run the same shared code firing identical event names,
         so one dataset would make them separable only by URL filter.
         Subsequent (client-side) route changes fire PageView from
         src/lib/track.js — this only covers the initial hard load. -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1030872029657370');
      fbq('track', 'PageView');
    </script>
  </head>
  <body>
    <!-- Meta Pixel no-JS fallback. Meta's copy-paste snippet puts this in
         <head>, but <noscript> there may only hold <link>/<style>/<meta> —
         an <img> is a parse error and Vite's HTML parser rejects the build.
         It belongs in <body>. -->
    <noscript><img height="1" width="1" style="display:none" alt=""
      src="https://www.facebook.com/tr?id=1030872029657370&ev=PageView&noscript=1" /></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
